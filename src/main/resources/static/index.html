          content="width=device-width, initial-scale=1.0"/>

    <title>AI Voice Assistant</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #212121;
            height: 100vh;

        }

        .header {

<body>

<div class="app">

    <div class="header">
        🤖 AI Assistant
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message-row bot-row">

            <div class="message bot">

                Hello 👋<br>
                What can I do for you?

            </div>

        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <button id="micBtn"
                    onclick="startVoice()">
                🎤
            </button>

            <input
                    type="text"
                    id="message"
                    placeholder="Message AI Assistant..."
            >

            <button onclick="sendMessage()">
                ↑
            </button>

            <button class="stop-btn"
                    onclick="stopVoice()">
                ⏹
            </button>

        </div>

    </div>

</div>

<script>

    const input =
        document.getElementById("message");

    const chatBox =
        document.getElementById("chatBox");

    const micBtn =
        document.getElementById("micBtn");


    /*
     * ==========================================
     * VOICE INITIALIZATION
     * ==========================================
     */

    let availableVoices = [];

    function loadVoices() {

        availableVoices =
            window.speechSynthesis.getVoices();

        console.log(
            "Available voices:",
            availableVoices
        );
    }

    loadVoices();

    if ("onvoiceschanged" in speechSynthesis) {

        speechSynthesis.onvoiceschanged =
            loadVoices;
    }


    /*
     * ==========================================
     * ENTER KEY
     * ==========================================
     */

    input.addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


    /*
     * ==========================================
     * SEND MESSAGE
     * ==========================================
     */

    async function sendMessage() {

        const text =
            input.value.trim();

        if (text === "") return;

        addMessage(text, "user");

        input.value = "";

        showTyping();

        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "text/plain"
                        },

                        body: text
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server returned " +
                    response.status
                );

            }


            const data =
                await response.text();


            removeTyping();

            addMessage(data, "bot");

            speak(data);


        } catch (error) {

            console.error(
                "Chat Error:",
                error
            );

            removeTyping();

            addMessage(
                "⚠ Backend Connection Error",
                "bot"
            );

        }

    }


    /*
     * ==========================================
     * ADD MESSAGE
     * ==========================================
     */

    function addMessage(text, type) {

        const row =
            document.createElement("div");

        row.className =
            "message-row " +
            (
                type === "user"
                    ? "user-row"
                    : "bot-row"
            );


        const msg =
            document.createElement("div");

        msg.className =
            "message " + type;

        msg.innerHTML =
            text;


        row.appendChild(msg);

        chatBox.appendChild(row);

        scrollBottom();

    }


    /*
     * ==========================================
     * TYPING INDICATOR
     * ==========================================
     */

    function showTyping() {

        const typing =
            document.createElement("div");

        typing.className =
            "message-row bot-row";

        typing.id =
            "typing";


        typing.innerHTML = `

            <div class="message bot typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        `;


        chatBox.appendChild(typing);

        scrollBottom();

    }


    function removeTyping() {

        const typing =
            document.getElementById("typing");

        if (typing) {

            typing.remove();

        }

    }


    /*
     * ==========================================
     * AUTO SCROLL
     * ==========================================
     */

    function scrollBottom() {

        chatBox.scrollTop =
            chatBox.scrollHeight;

    }


    /*
     * ==========================================
     * VOICE INPUT
     * ==========================================
     */

    function startVoice() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "Please use Google Chrome for voice input."
            );

            return;

        }


        const recognition =
            new SpeechRecognition();


        recognition.lang =
            "en-IN";

        recognition.continuous =
            false;

        recognition.interimResults =
            false;

        recognition.maxAlternatives =
            1;


        recognition.onstart =
            function() {

                micBtn.classList.add(
                    "mic-active"
                );

                console.log(
                    "Voice Started"
                );

            };


        recognition.onresult =
            function(event) {

                const text =
                    event.results[0][0].transcript;

                input.value =
                    text;

                sendMessage();

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Speech Recognition Error:",
                    event.error
                );

                micBtn.classList.remove(
                    "mic-active"
                );


                if (
                    event.error ===
                    "not-allowed"
                ) {

                    alert(
                        "Microphone permission is blocked."
                    );

                } else {

                    alert(
                        "Voice recognition failed."
                    );

                }

            };


        recognition.onend =
            function() {

                micBtn.classList.remove(
                    "mic-active"
                );

            };


        recognition.start();

    }


    /*
     * ==========================================
     * SELECT BEST VOICE
     * ==========================================
     */

    function getBestVoice() {

        const voices =
            window.speechSynthesis.getVoices();


        if (!voices || voices.length === 0) {

            return null;

        }


        /*
         * First preference:
         * Hindi India voice
         */

        let voice =
            voices.find(
                v =>
                    v.lang === "hi-IN"
            );


        if (voice) {

            return voice;

        }


        /*
         * Second preference:
         * Any Hindi voice
         */

        voice =
            voices.find(
                v =>
                    v.lang &&
                    v.lang
                        .toLowerCase()
                        .startsWith("hi")
            );


        if (voice) {

            return voice;

        }


        /*
         * Third preference:
         * Indian English voice
         */

        voice =
            voices.find(
                v =>
                    v.lang === "en-IN"
            );


        if (voice) {

            return voice;

        }


        /*
         * Fourth preference:
         * Google voice
         */

        voice =
            voices.find(
                v =>
                    v.name &&
                    v.name
                        .toLowerCase()
                        .includes("google")
            );


        if (voice) {

            return voice;

        }


        /*
         * Final fallback
         */

        return voices[0];

    }


    /*
     * ==========================================
     * TEXT TO SPEECH
     * ==========================================
     */

    function speak(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            console.log(
                "Speech synthesis not supported."
            );

            return;

        }


        window.speechSynthesis.cancel();


        /*
         * Remove HTML tags before speaking
         */

        const cleanText =
            text
                .replace(
                    /<[^>]*>/g,
                    " "
                )
                .replace(
                    /&nbsp;/g,
                    " "
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        if (!cleanText) return;


        const speech =
            new SpeechSynthesisUtterance(
                cleanText
            );


        const voice =
            getBestVoice();


        if (voice) {

            speech.voice =
                voice;

            speech.lang =
                voice.lang;

            console.log(
                "Using voice:",
                voice.name,
                voice.lang
            );

        } else {

            speech.lang =
                "hi-IN";

        }


        /*
         * Speech clarity settings
         */

        speech.rate =
            0.85;

        speech.pitch =
            1.0;

        speech.volume =
            1.0;


        /*
         * Speak
         */

        window.speechSynthesis.speak(
            speech
        );

    }


    /*
     * ==========================================
     * STOP VOICE
     * ==========================================
     */

    function stopVoice() {

        window.speechSynthesis.cancel();

    }

</script>

</body>

</html>
